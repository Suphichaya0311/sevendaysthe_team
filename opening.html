<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
</head>

<body class="center">

<div id="text" class="title"></div>

<script>
const messages = [
"เรื่องราวบางเรื่อง",
"เริ่มต้นจากคนแปลกหน้า",
"แล้ววันหนึ่ง",
"พวกเขากลายเป็นความทรงจำที่สำคัญ"
];

let i=0;

function showText(){
    document.getElementById("text").innerText = messages[i];
    i++;

    if(i < messages.length){
        setTimeout(showText,2500);
    }else{
        setTimeout(()=>{
            window.location.href="video.html";
        },2500);
    }
}

showText();
</script>

</body>
</html>
