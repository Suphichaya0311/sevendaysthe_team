<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<style>
body{
    margin:0;
    background:black;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
    font-family:sans-serif;
}

.text{
    font-size:32px;
    opacity:0;
    transition:2s;
}
</style>
</head>

<body>

<div id="text" class="text"></div>

<script>

const lines = [
"บางช่วงเวลาในชีวิต",
"เราไม่ได้อยากให้มันจบเลย",
"",
"แล้วเจอกัน",
"ในวันที่เราเติบโต"
];

let i = 0;
const el = document.getElementById("text");

function showLine(){
    el.style.opacity = 0;

    setTimeout(()=>{
        el.innerText = lines[i];
        el.style.opacity = 1;
        i++;

        if(i < lines.length){
            setTimeout(showLine,3000);
        }
    },1000);
}

showLine();

</script>

</body>
</html>
