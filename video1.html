<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Video 1</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="video-page">

<!-- ปุ่มเริ่ม -->
<div id="overlay">
    <button class="play-btn" onclick="playVideo()">
        ▶ เปิดเสียง & เริ่มดู
    </button>
</div>

<!-- วิดีโอ -->
<div class="video-container">
<iframe id="ytplayer"
src="https://www.youtube.com/embed/_p_Q439Kl68?enablejsapi=1&controls=0"
frameborder="0"
allow="autoplay; fullscreen"
allowfullscreen>
</iframe>
</div>

<!-- ข้อความก่อนคลิป 2 -->
<div id="messageScreen">
    <h1>ยังไม่หมดนะ 🤍</h1>
    <p>มีอะไรบางอย่างอยากให้ดูต่อ...</p>
</div>

<script>

let player = document.getElementById("ytplayer");

function playVideo(){
    player.contentWindow.postMessage(
        '{"event":"command","func":"playVideo","args":""}',
        '*'
    );
    document.getElementById("overlay").style.display="none";
}

/* เวลาคลิป 7:31 */
setTimeout(()=>{
    showMessage();
},451000);

function showMessage(){
    document.getElementById("messageScreen").style.display="flex";

    setTimeout(()=>{
        window.location.href="video2.html";
    },3000);
}

</script>

</body>
</html>
