<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Video 1</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="video-page">

<div id="overlay">

<button id="startBtn">
▶ เปิดเสียง & เริ่มดู
</button>

</div>

<iframe
id="yt"
src="https://www.youtube.com/embed/_p_Q439Kl68?controls=0&rel=0"
allowfullscreen>
</iframe>

<div id="memoryScreen">

<h1>
ขอบคุณที่อยู่ในทุกช่วงเวลาของกันและกันนะ 🤍
</h1>

<p>
ยังมีอีกอย่างอยากให้ดูต่อ...
</p>

<button id="nextBtn">
ดูต่อ 🎬
</button>

</div>

<audio id="bgmusic">
<source src="song.mp3" type="audio/mp3">
</audio>

<script>

const startBtn = document.getElementById("startBtn");
const overlay = document.getElementById("overlay");
const memoryScreen = document.getElementById("memoryScreen");
const nextBtn = document.getElementById("nextBtn");
const bgmusic = document.getElementById("bgmusic");

startBtn.onclick = () => {

    overlay.style.display = "none";

    document.getElementById("yt").src =
    "https://www.youtube.com/embed/_p_Q439Kl68?autoplay=1&controls=0&mute=0";

}

/* 7 นาที 31 วิ */

setTimeout(()=>{

    document.getElementById("yt").style.display = "none";

    memoryScreen.style.display = "flex";

    bgmusic.play();

},451000);

nextBtn.onclick = () => {

    window.location.href = "video2.html";

}

</script>

</body>
</html>
