<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Video 1</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="video-page">

<!-- ปุ่มเปิด -->
<div id="overlay">
    <button class="play-btn" onclick="startVideo()">
        ▶ เปิดเสียง & เริ่มดู
    </button>
</div>

<!-- YouTube -->
<div class="video-container">

<iframe
id="ytplayer"
src="https://www.youtube.com/embed/_p_Q439Kl68?autoplay=1&controls=0"
allow="autoplay; fullscreen"
allowfullscreen>
</iframe>

</div>

<!-- ข้อความ -->
<div id="memoryText">

<p class="text1">
ขอบคุณที่อยู่ในทุกช่วงเวลาของกันและกันนะ 🤍
</p>

<p class="text2">
ยังมีอีกอย่างอยากให้ดูต่อ...
</p>

<button class="next-btn" onclick="goNext()">
ดูต่อ 🎬
</button>

</div>

<!-- เพลง -->
<audio id="bgmusic">
<source src="song.mp3" type="audio/mp3">
</audio>

<script>

function startVideo(){

    document.getElementById("overlay").style.display="none";

    /* 7:31 */
    setTimeout(()=>{

        document.querySelector(".video-container").style.display="none";

        document.body.style.background="black";

        document.getElementById("memoryText").style.opacity="1";

        document.getElementById("bgmusic").play();

    },451000);

}

function goNext(){
    window.location.href="video2.html";
}

</script>

</body>
</html>
