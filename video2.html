<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Ending</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="video-page">

<video id="video2" autoplay>

<source src="video2.mp4" type="video/mp4">

</video>

<div id="endingText">

<h1>
บางช่วงเวลาในชีวิต<br>
เราไม่ได้อยากให้มันจบเลย
</h1>

<p>
แล้วเจอกัน<br>
ในวันที่เราเติบโต 🤍
</p>

<button id="closeBtn">
ปิดความทรงจำ ✨
</button>

</div>

<script>

const video = document.getElementById("video2");

video.onended = () => {

    video.style.display = "none";

    document.getElementById("endingText").style.display = "flex";

}

/* ปุ่มปิด */

document.getElementById("closeBtn").onclick = () => {

    document.body.innerHTML = `
    
    <div style="
    width:100vw;
    height:100vh;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:30px;
    font-family:sans-serif;
    flex-direction:column;
    ">
    
    <div style="opacity:0.8;">
    ขอบคุณสำหรับทุกช่วงเวลานะ 🤍
    </div>
    
    </div>
    
    `;

}

</script>

</body>
</html>
