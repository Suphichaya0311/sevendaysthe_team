<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Ending</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="video-page">

<video id="video2" autoplay>

<source src="video2.mp4" type="video/mp4">

</video>

<!-- ตอนจบ -->

<div id="endingText">

<div class="floating floating1">🤍</div>
<div class="floating floating2">✨</div>
<div class="floating floating3">☁️</div>

<h1 class="end1">
บางช่วงเวลาในชีวิต<br>
เราไม่ได้อยากให้มันจบเลย
</h1>

<h2 class="end2">
แล้วเจอกัน<br>
ในวันที่เราเติบโต 🤍
</h2>

</div>

<script>

const video = document.getElementById("video2");

video.onended = () => {

    video.style.display = "none";

    document.getElementById("endingText").style.opacity = "1";

}

</script>

</body>
</html>
