<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Ending</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="video-page">

<video id="video2" autoplay>

<source src="video2.mp4" type="video/mp4">

</video>

<div id="endingText">

<h1 class="fadeText1">
บางช่วงเวลาในชีวิต<br>
เราไม่ได้อยากให้มันจบเลย
</h1>

<p class="fadeText2">
แล้วเจอกัน<br>
ในวันที่เราเติบโต 🤍
</p>

</div>

<script>

const video = document.getElementById("video2");

video.onended = () => {

    video.style.display = "none";

    const ending = document.getElementById("endingText");

    ending.style.display = "flex";

    /* รอ 8 วิ แล้วค่อย fade ดำ */

    setTimeout(() => {

        document.body.style.transition = "3s";
        document.body.style.opacity = "0";

    },8000);

    /* หลัง fade เสร็จ ปิดหน้า */

    setTimeout(() => {

        window.close();

        /* ถ้าปิดไม่ได้ */
        window.location.href = "about:blank";

    },11000);

}

</script>

</body>
</html>
